<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT Trading Platform</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root {
            --bg-main: #0f0f13;
            --bg-panel: #1a1a20;
            --bg-input: #121217;
            --text-main: #ffffff;
            --text-muted: #888890;
            --accent-gold: #f4b241;
            --accent-green: #4caf50;
            --accent-red: #f44336;
            --border-color: #2c2c35;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 30px 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header h4 {
            color: var(--accent-gold);
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .header h1 { font-size: 1.8rem; letter-spacing: 1px; }

        .export-btn {
            background-color: var(--accent-gold);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .export-btn:hover { opacity: 0.9; }

        .dashboard {
            display: grid;
            grid-template-columns: 420px 1fr;
            gap: 25px;
        }

        .log-panel {
            background-color: var(--bg-panel);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: fit-content;
        }

        .log-panel h3 {
            margin-bottom: 20px;
            font-size: 1.2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .form-row { display: flex; gap: 12px; margin-bottom: 12px; }
        .form-group { flex: 1; display: flex; flex-direction: column; width: 100%; }
        
        .form-group label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 10px;
            border-radius: 6px;
            outline: none;
            font-size: 0.85rem;
        }

        input:focus, select:focus, textarea:focus { border-color: var(--accent-gold); }
        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); }
        input[readonly] { color: var(--accent-gold); font-weight: bold; background-color: rgba(244, 178, 65, 0.05); }
        textarea { resize: vertical; min-height: 50px; }

        .checkboxes {
            display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
            margin: 5px 0 12px 0; background-color: var(--bg-input); padding: 10px;
            border-radius: 6px; border: 1px solid var(--border-color);
        }
        .checkboxes label { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; cursor: pointer; }

        .log-btn {
            background-color: var(--accent-gold); color: #000; border: none;
            padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px;
        }
        .log-btn:hover { opacity: 0.9; }
        .motivation { text-align: center; margin-top: 20px; font-size: 0.8rem; color: var(--accent-gold); letter-spacing: 3px; font-weight: 600; opacity: 0.7; text-transform: uppercase; }

        /* Right Panel */
        .right-panel { display: flex; flex-direction: column; gap: 20px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .stat-card {
            background-color: var(--bg-panel); padding: 15px; border-radius: 12px;
            border: 1px solid var(--border-color); text-align: center;
        }
        .stat-card h4 { color: var(--text-muted); font-size: 0.7rem; text-transform: uppercase; margin-bottom: 8px; }
        .stat-card .value { font-size: 1.5rem; font-weight: bold; }
        .value.green { color: var(--accent-green); }
        .value.red { color: var(--accent-red); }

        .progress-container { margin-top: 10px; background-color: var(--bg-input); border-radius: 20px; height: 6px; overflow: hidden; }
        .progress-bar { height: 100%; background-color: var(--accent-green); width: 0%; transition: width 0.5s; }
        .progress-text { font-size: 0.7rem; color: var(--text-muted); margin-top: 6px; display: block; }
        .balance-reached { color: var(--accent-gold) !important; font-weight: bold; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .ai-coach {
            background-color: rgba(244, 178, 65, 0.05); border: 1px solid var(--accent-gold);
            padding: 15px; border-radius: 12px;
        }
        .ai-coach h4 { color: var(--accent-gold); margin-bottom: 8px; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center;}
        .ai-coach p { font-size: 0.85rem; color: #ddd; line-height: 1.4; }
        .analyze-btn { background: transparent; border: 1px solid var(--accent-gold); color: var(--accent-gold); padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 0.7rem;}
        .analyze-btn:hover { background: var(--accent-gold); color: #000; }

        .chart-container { background-color: var(--bg-panel); border-radius: 12px; border: 1px solid var(--border-color); padding: 15px; height: 300px; }
        
        .table-container { background-color: var(--bg-panel); border-radius: 12px; border: 1px solid var(--border-color); padding: 20px; overflow-x: auto; max-height: 400px; overflow-y: auto;}
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        th { text-align: left; color: var(--text-muted); padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
        td { padding: 10px 0; border-bottom: 1px solid rgba(44, 44, 53, 0.5); }
        .text-green { color: var(--accent-green); }
        .text-red { color: var(--accent-red); }
        .delete-btn { background-color: transparent; color: var(--accent-red); border: 1px solid var(--accent-red); padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.7rem;}
        .delete-btn:hover { background-color: var(--accent-red); color: #fff; }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h4>NY AM Session</h4>
            <h1>ICT TRADING PLATFORM</h1>
        </div>
        <button class="export-btn" onclick="exportToExcel()">Export to Excel</button>
    </div>

    <div class="dashboard">
        <!-- LEFT PANEL -->
        <div class="log-panel">
            <h3>Log a Trade</h3>
            <div class="form-row">
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="tDate">
                </div>
                <div class="form-group">
                    <label>Time</label>
                    <input type="time" id="tTime">
                </div>
                <div class="form-group">
                    <label>Asset</label>
                    <input type="text" id="tAsset" value="MNQ">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Account Firm</label>
                    <select id="tFirm"><option>Lucid</option><option>Topstep</option></select>
                </div>
                <div class="form-group">
                    <label>Account Type</label>
                    <select id="tType"><option>Evaluation</option><option>Funded</option></select>
                </div>
                <div class="form-group">
                    <label>Total Contracts</label>
                    <input type="number" id="tContracts" placeholder="e.g. 5">
                </div>
            </div>

            <div class="checkboxes" id="setupCheckboxes">
                <label><input type="checkbox" value="Sweep"> Sweep</label>
                <label><input type="checkbox" value="iFVG"> iFVG</label>
                <label><input type="checkbox" value="PD Array"> PD Array</label>
                <label><input type="checkbox" value="MSS"> MSS</label>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Entry Price</label>
                    <input type="number" id="entry" step="any">
                </div>
                <div class="form-group">
                    <label>Stop Loss</label>
                    <input type="number" id="stop" step="any">
                </div>
                <div class="form-group">
                    <label>Final Exit</label>
                    <input type="number" id="exit" step="any">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Partials (Price x Qty)</label>
                    <input type="text" id="tPartials" placeholder="e.g. 19850 (2), 19865 (1)">
                </div>
                <div class="form-group">
                    <label>Duration (Mins)</label>
                    <input type="number" id="tDuration" placeholder="e.g. 15">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Profit/Loss ($)</label>
                    <input type="number" id="pnl" placeholder="e.g. 400 or -150">
                </div>
                <div class="form-group">
                    <label>Realized RR</label>
                    <input type="text" id="rr" readonly placeholder="0.00 R">
                </div>
            </div>

            <div class="form-row" style="margin-bottom:0;">
                <div class="form-group">
                    <label>Deep Analysis</label>
                    <textarea id="tAnalysis" placeholder="What confirmed the entry? Did you respect your rules?"></textarea>
                </div>
            </div>

            <button class="log-btn" onclick="logTrade()">Log Trade</button>
            <div class="motivation">You are the 1%</div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="right-panel">
            <div class="stats-grid">
                <div class="stat-card">
                    <h4>Total Trades</h4>
                    <div class="value" id="totalTrades">0</div>
                </div>
                <div class="stat-card">
                    <h4>Win Rate</h4>
                    <div class="value" id="winRate">0%</div>
                </div>
                <div class="stat-card">
                    <h4>Net PNL</h4>
                    <div class="value" id="netPnl">$0</div>
                </div>
                <div class="stat-card">
                    <h4 id="evalTitle">Evaluation Progress</h4>
                    <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
                    <span class="progress-text" id="progressText">$0 / $3,000</span>
                </div>
            </div>

            <!-- AI COACH SECTION -->
            <div class="ai-coach">
                <h4>AI Trade Analysis <button class="analyze-btn" onclick="generateAIFeedback()">Run Analysis</button></h4>
                <p id="aiOutput">Waiting for logs... Click "Run Analysis" to get feedback on your execution and discipline.</p>
            </div>

            <div class="chart-container">
                <canvas id="pnlChart"></canvas>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Date / Time</th>
                            <th>Setup</th>
                            <th>Qty</th>
                            <th>RR</th>
                            <th>PNL</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('tDate').valueAsDate = new Date();
        const entryInput = document.getElementById('entry'), stopInput = document.getElementById('stop'), exitInput = document.getElementById('exit'), rrOutput = document.getElementById('rr');
        let currentRR = 0;

        function calcRR() {
            const ent = parseFloat(entryInput.value), stp = parseFloat(stopInput.value), ext = parseFloat(exitInput.value);
            if (!isNaN(ent) && !isNaN(stp) && !isNaN(ext)) {
                const risk = Math.abs(ent - stp), rew = Math.abs(ext - ent);
                if (risk > 0) { currentRR = (rew / risk).toFixed(2); rrOutput.value = currentRR + " R"; }
            } else { rrOutput.value = ""; currentRR = 0; }
        }
        entryInput.addEventListener('input', calcRR); stopInput.addEventListener('input', calcRR); exitInput.addEventListener('input', calcRR);

        // --- CORE DATA ENGINE (LocalStorage) ---
        let tradesData = JSON.parse(localStorage.getItem('ictJournal')) || [];
        let pnlChartInstance = null;

        function initDashboard() { renderDashboard(); }

        function renderDashboard() {
            let totalPnl = 0, wins = 0;
            let chartData = [0], chartLabels = ["Start"];
            const tbody = document.getElementById('historyTableBody');
            tbody.innerHTML = '';

            tradesData.forEach((trade, index) => {
                totalPnl += trade.PNL;
                if(trade.PNL > 0) wins++;
                
                chartData.push(totalPnl);
                chartLabels.push("T" + (index + 1));

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${trade.Date} ${trade.Time}</td>
                    <td>${trade.Asset} - ${trade.Setups}</td>
                    <td>${trade.Contracts}</td>
                    <td>${trade.RR} R</td>
                    <td class="${trade.PNL >= 0 ? 'text-green' : 'text-red'}">${trade.PNL >= 0 ? '+$' : '-$'}${Math.abs(trade.PNL)}</td>
                    <td><button class="delete-btn" onclick="deleteTrade(${trade.id})">Remove</button></td>
                `;
                tbody.insertBefore(tr, tbody.firstChild); // Newest on top
            });

            // Update Stats
            document.getElementById('totalTrades').innerText = tradesData.length;
            document.getElementById('winRate').innerText = tradesData.length ? ((wins / tradesData.length) * 100).toFixed(0) + "%" : "0%";
            
            const netEl = document.getElementById('netPnl');
            netEl.innerText = (totalPnl >= 0 ? "+$" : "-$") + Math.abs(totalPnl);
            netEl.className = totalPnl >= 0 ? "value green" : "value red";

            // Update Eval Bar
            let prog = (totalPnl / 3000) * 100;
            if(prog > 100) prog = 100; if(prog < 0) prog = 0;
            document.getElementById('progressBar').style.width = prog + "%";
            
            if(totalPnl >= 3000) {
                document.getElementById('progressText').innerText = "Target Hit!";
                document.getElementById('evalTitle').innerText = "BALANCE REACHED";
                document.getElementById('evalTitle').classList.add('balance-reached');
                document.getElementById('progressBar').style.backgroundColor = "var(--accent-gold)";
            } else {
                document.getElementById('progressText').innerText = "$" + totalPnl + " / $3000";
                document.getElementById('evalTitle').innerText = "Evaluation Progress";
                document.getElementById('evalTitle').classList.remove('balance-reached');
                document.getElementById('progressBar').style.backgroundColor = "var(--accent-green)";
            }

            // Render Chart
            renderChart(chartLabels, chartData, totalPnl);
        }

        function renderChart(labels, data, totalPnl) {
            const ctx = document.getElementById('pnlChart').getContext('2d');
            if(pnlChartInstance) pnlChartInstance.destroy();
            
            pnlChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Net PNL',
                        data: data,
                        borderColor: totalPnl >= 0 ? '#4caf50' : '#f44336',
                        backgroundColor: totalPnl >= 0 ? 'rgba(76, 175, 80, 0.1)' : 'rgba(244, 67, 54, 0.1)',
                        borderWidth: 2, fill: true, tension: 0.3
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { grid: { color: '#2c2c35' } } } }
            });
        }

        function logTrade() {
            const pnlValue = parseFloat(document.getElementById('pnl').value);
            if (isNaN(pnlValue)) { alert("Enter a valid PNL."); return; }

            const cbs = document.querySelectorAll('#setupCheckboxes input[type="checkbox"]:checked');
            const tags = Array.from(cbs).map(cb => cb.value).join(', ') || "None";

            const newTrade = {
                id: Date.now(), // Unique ID for deleting
                Date: document.getElementById('tDate').value,
                Time: document.getElementById('tTime').value || "--:--",
                Asset: document.getElementById('tAsset').value || "MNQ",
                Account: document.getElementById('tFirm').value + " " + document.getElementById('tType').value,
                Contracts: document.getElementById('tContracts').value || "1",
                Setups: tags,
                Entry: entryInput.value, StopLoss: stopInput.value, Exit: exitInput.value,
                Partials: document.getElementById('tPartials').value || "None",
                Duration: document.getElementById('tDuration').value || "0",
                RR: currentRR,
                PNL: pnlValue,
                Analysis: document.getElementById('tAnalysis').value
            };

            tradesData.push(newTrade);
            localStorage.setItem('ictJournal', JSON.stringify(tradesData));
            
            // Clear form
            document.getElementById('pnl').value = ""; document.getElementById('tAnalysis').value = "";
            document.getElementById('tPartials').value = ""; document.getElementById('tDuration').value = "";
            entryInput.value = ""; stopInput.value = ""; exitInput.value = ""; rrOutput.value = "";
            cbs.forEach(cb => cb.checked = false);

            renderDashboard();
        }

        function deleteTrade(id) {
            tradesData = tradesData.filter(trade => trade.id !== id);
            localStorage.setItem('ictJournal', JSON.stringify(tradesData));
            renderDashboard();
        }

        function exportToExcel() {
            if (tradesData.length === 0) { alert("No logs to export."); return; }
            // Remove the unique ID before exporting so it looks clean
            const exportData = tradesData.map(({id, ...rest}) => rest);
            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Journal");
            XLSX.writeFile(wb, "ICT_History_Log.xlsx");
        }

        // --- LOCAL AI COACH ---
        function generateAIFeedback() {
            if(tradesData.length < 3) {
                document.getElementById('aiOutput').innerText = "Not enough data. Log at least 3 trades for accurate analysis.";
                return;
            }
            let wins = 0, totalRR = 0, earlyCloses = 0;
            tradesData.forEach(t => {
                if(t.PNL > 0) wins++;
                totalRR += parseFloat(t.RR || 0);
                if(parseFloat(t.RR) > 0 && parseFloat(t.RR) < 1) earlyCloses++;
            });
            const wr = (wins / tradesData.length);
            const avgRR = (totalRR / tradesData.length);
            
            let feedback = "";
            if (avgRR < 1.2 && wr > 0.5) {
                feedback = `Your win rate is solid (${(wr*100).toFixed(0)}%), but your average RR is too low (${avgRR.toFixed(2)} R). You are likely cutting your winners short. Trust the premium/discount array and hold for the draw on liquidity.`;
            } else if (wr < 0.4) {
                feedback = `You are taking too many paper cuts. Wait for obvious market structure shifts with displacement. Don't force setups just because the session opened.`;
            } else if (earlyCloses >= 2) {
                feedback = `I'm seeing multiple trades closed for less than 1R. If the setup is valid (iFVG + Sweep), let it breathe. Don't panic out at the first partial target.`;
            } else {
                feedback = `Execution is on point. Win rate and RR are in harmony. Keep scaling your contracts logically and stick to the model. You are the 1%.`;
            }
            document.getElementById('aiOutput').innerText = feedback;
        }

        // Init on load
        initDashboard();
    </script>
</body>
</html>
