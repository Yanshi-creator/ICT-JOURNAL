<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT Trading Platform</title>
    <style>
        :root {
            --bg-main: #0f0f13;
            --bg-panel: #1a1a20;
            --bg-input: #121217;
            --text-main: #ffffff;
            --text-muted: #888890;
            --accent-gold: #f4b241;
            --accent-green: #4caf50;
            --accent-red: #f44336;
            --border-color: #2c2c35;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h4 {
            color: var(--accent-gold);
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .header h1 {
            font-size: 1.8rem;
            letter-spacing: 1px;
        }

        .export-btn {
            background-color: var(--accent-gold);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        
        .export-btn:hover {
            opacity: 0.9;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 25px;
        }

        /* Left Panel - Logging */
        .log-panel {
            background-color: var(--bg-panel);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .log-panel h3 {
            margin-bottom: 20px;
            font-size: 1.2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .form-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 6px;
            outline: none;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-gold);
        }

        /* Read-only field styling */
        input[readonly] {
            color: var(--accent-gold);
            font-weight: bold;
            background-color: rgba(244, 178, 65, 0.05);
            cursor: not-allowed;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .checkboxes {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin: 5px 0 15px 0;
            background-color: var(--bg-input);
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .checkboxes label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            user-select: none;
        }

        .log-btn {
            background-color: var(--accent-gold);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s;
            width: 100%;
        }

        .log-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .motivation {
            text-align: center;
            margin-top: 25px;
            font-size: 0.85rem;
            color: var(--accent-gold);
            letter-spacing: 3px;
            font-weight: 600;
            opacity: 0.7;
            text-transform: uppercase;
        }

        /* Right Panel - Stats & Visuals */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background-color: var(--bg-panel);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .stat-card h4 {
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .stat-card .value {
            font-size: 1.8rem;
            font-weight: bold;
        }

        .value.green { color: var(--accent-green); }

        /* Progress Bar Styles */
        .progress-container {
            margin-top: 12px;
            background-color: var(--bg-input);
            border-radius: 20px;
            height: 8px;
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--accent-green);
            width: 0%;
            transition: width 0.5s ease-in-out, background-color 0.5s;
        }

        .progress-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 8px;
            display: block;
            font-weight: 500;
        }

        .balance-reached {
            color: var(--accent-gold) !important;
            font-weight: bold;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .chart-placeholder {
            background-color: var(--bg-panel);
            height: 400px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            margin-bottom: 25px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h4>NY AM Session</h4>
            <h1>ICT TRADING PLATFORM</h1>
        </div>
        <button class="export-btn">Export to Excel (.xlsx)</button>
    </div>

    <div class="dashboard">
        <!-- LEFT PANEL: LOGGING -->
        <div class="log-panel">
            <h3>Log a Trade</h3>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Account Firm</label>
                    <select><option>Lucid</option></select>
                </div>
                <div class="form-group">
                    <label>Account Type</label>
                    <select><option>Evaluation</option></select>
                </div>
                <div class="form-group">
                    <label>Time Frame</label>
                    <select>
                        <option>1m</option>
                        <option>5m</option>
                        <option>15m</option>
                        <option>1H</option>
                        <option>4H</option>
                        <option>Daily</option>
                    </select>
                </div>
            </div>

            <div class="checkboxes">
                <label><input type="checkbox"> Sweep</label>
                <label><input type="checkbox"> iFVG</label>
                <label><input type="checkbox"> PD Array</label>
                <label><input type="checkbox"> BOS</label>
            </div>

            <!-- Pricing for Auto-RR -->
            <div class="form-row">
                <div class="form-group">
                    <label>Entry Price</label>
                    <input type="number" id="entry" step="any" placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>Stop Loss</label>
                    <input type="number" id="stop" step="any" placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>Final Exit</label>
                    <input type="number" id="exit" step="any" placeholder="0.00">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Profit/Loss ($)</label>
                    <input type="number" id="pnl" placeholder="e.g. 400">
                </div>
                <div class="form-group">
                    <label>Average RR (Auto)</label>
                    <input type="text" id="rr" readonly placeholder="0.00 R">
                </div>
            </div>

            <!-- Fixed Thought Process Box -->
            <div class="form-row">
                <div class="form-group">
                    <label>Market Analysis & Thought Process</label>
                    <textarea rows="4" placeholder="What confirmed the entry? (e.g., Liquidity taken, displacement, etc.)"></textarea>
                </div>
            </div>

            <button class="log-btn" onclick="logTrade()">Log Trade</button>

            <!-- MOTIVATIONAL ANCHOR -->
            <div class="motivation">You are the 1%</div>
        </div>

        <!-- RIGHT PANEL: STATS -->
        <div class="main-content">
            <div class="stats-grid">
                <div class="stat-card">
                    <h4>Total Trades</h4>
                    <div class="value" id="totalTrades">0</div>
                </div>
                <div class="stat-card">
                    <h4>Win Rate</h4>
                    <div class="value">100%</div>
                </div>
                <div class="stat-card">
                    <h4>Net PNL</h4>
                    <div class="value green" id="netPnl">+$0</div>
                </div>
                
                <!-- EVAL PROGRESS TRACKER -->
                <div class="stat-card">
                    <h4 id="evalTitle">Evaluation Progress</h4>
                    <div class="progress-container">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                    <span class="progress-text" id="progressText">$0 / $3,000</span>
                </div>
            </div>

            <div class="chart-placeholder">
                [ Chart / History Data Will Render Here ]
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // 1. Auto Calculate RR Logic
        const entryInput = document.getElementById('entry');
        const stopInput = document.getElementById('stop');
        const exitInput = document.getElementById('exit');
        const rrOutput = document.getElementById('rr');

        function calculateRR() {
            const entry = parseFloat(entryInput.value);
            const stop = parseFloat(stopInput.value);
            const exit = parseFloat(exitInput.value);

            if (!isNaN(entry) && !isNaN(stop) && !isNaN(exit)) {
                const risk = Math.abs(entry - stop);
                const reward = Math.abs(exit - entry);

                if (risk > 0) {
                    const rr = (reward / risk).toFixed(2);
                    rrOutput.value = rr + " R";
                }
            } else {
                rrOutput.value = "";
            }
        }

        entryInput.addEventListener('input', calculateRR);
        stopInput.addEventListener('input', calculateRR);
        exitInput.addEventListener('input', calculateRR);

        // 2. 3K Passing Tracker Logic
        let currentTotalPnl = 0;
        let tradesCount = 0;
        const targetGoal = 3000;

        function logTrade() {
            const pnlInput = document.getElementById('pnl');
            const pnlValue = parseFloat(pnlInput.value);

            if(!isNaN(pnlValue)) {
                currentTotalPnl += pnlValue;
                tradesCount++;
                
                document.getElementById('totalTrades').innerText = tradesCount;
                document.getElementById('netPnl').innerText = (currentTotalPnl >= 0 ? "+$" : "-$") + Math.abs(currentTotalPnl);
                document.getElementById('netPnl').className = currentTotalPnl >= 0 ? "value green" : "value";
                if(currentTotalPnl < 0) document.getElementById('netPnl').style.color = "var(--accent-red)";
                else document.getElementById('netPnl').style.color = "var(--accent-green)";

                let progressPercentage = (currentTotalPnl / targetGoal) * 100;
                
                if(progressPercentage > 100) progressPercentage = 100;
                if(progressPercentage < 0) progressPercentage = 0;

                const progressBar = document.getElementById('progressBar');
                const progressText = document.getElementById('progressText');
                const evalTitle = document.getElementById('evalTitle');

                progressBar.style.width = progressPercentage + "%";

                if(currentTotalPnl >= targetGoal) {
                    progressText.innerText = "Target Hit!";
                    progressText.classList.add("balance-reached");
                    evalTitle.innerText = "BALANCE REACHED";
                    evalTitle.classList.add("balance-reached");
                    progressBar.style.backgroundColor = "var(--accent-gold)";
                } else {
                    progressText.innerText = "$" + currentTotalPnl + " / $" + targetGoal;
                    progressText.classList.remove("balance-reached");
                    evalTitle.innerText = "Evaluation Progress";
                    evalTitle.classList.remove("balance-reached");
                    progressBar.style.backgroundColor = "var(--accent-green)";
                }

                pnlInput.value = "";
            }
        }
    </script>
</body>
</html>
