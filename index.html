<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT NY AM Journal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { ict: '#E0A93E', dark: '#0A0C10', panel: '#12151B', border: '#1F242C' } }
            }
        }
    </script>
    <style>
        body { background-color: #0A0C10; color: #E7EAEE; font-family: 'Inter', sans-serif; }
        input, select, textarea { background-color: #0D1015; border: 1px solid #1F242C; color: white; padding: 0.5rem; border-radius: 0.375rem; width: 100%; }
        input:focus, select:focus, textarea:focus { outline: 2px solid #E0A93E; }
    </style>
</head>
<body class="p-6 max-w-7xl mx-auto">

    <header class="flex justify-between items-end mb-8 border-b border-border pb-4">
        <div>
            <div class="text-ict text-xs font-mono tracking-widest mb-1">NY AM SESSION</div>
            <h1 class="text-3xl font-bold font-mono">ICT TRADING PLATFORM</h1>
        </div>
        <button onclick="exportToExcel()" class="bg-ict text-dark px-4 py-2 rounded font-bold hover:opacity-90">
            Export to Excel (.xlsx)
        </button>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- LOGGING FORM -->
        <div class="lg:col-span-1 bg-panel p-6 rounded-xl border border-border">
            <h2 class="text-lg font-bold mb-4 text-gray-400">Log a Trade</h2>
            <form id="tradeForm" class="space-y-4">
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs text-gray-500 block mb-1">Date</label>
                        <input type="date" id="date" required>
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 block mb-1">Time Entered (ET)</label>
                        <input type="time" id="time" required>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs text-gray-500 block mb-1">Account Firm</label>
                        <select id="firm">
                            <option>Lucid</option>
                            <option>Alpha</option>
                            <option>Apex</option>
                            <option>Personal</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 block mb-1">Account Type</label>
                        <select id="accType">
                            <option>Eval</option>
                            <option>Funded</option>
                            <option>Live</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="text-xs text-gray-500 block mb-1">News Impact</label>
                    <select id="news">
                        <option>Low / None</option>
                        <option>Medium (Orange)</option>
                        <option>High (Red)</option>
                    </select>
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <label class="flex items-center space-x-2 text-sm bg-dark p-2 rounded border border-border cursor-pointer">
                        <input type="checkbox" value="Liquidity Sweep" class="ict-tags accent-ict"> <span>Sweep</span>
                    </label>
                    <label class="flex items-center space-x-2 text-sm bg-dark p-2 rounded border border-border cursor-pointer">
                        <input type="checkbox" value="iFVG" class="ict-tags accent-ict"> <span>iFVG</span>
                    </label>
                    <label class="flex items-center space-x-2 text-sm bg-dark p-2 rounded border border-border cursor-pointer">
                        <input type="checkbox" value="HTF PD Array" class="ict-tags accent-ict"> <span>PD Array</span>
                    </label>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs text-gray-500 block mb-1">Entry Price</label>
                        <input type="number" step="0.25" id="entry" required>
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 block mb-1">Final Exit Price</label>
                        <input type="number" step="0.25" id="exit" required>
                    </div>
                </div>

                <div>
                    <label class="text-xs text-gray-500 block mb-1">Partials Taken (Prices separated by commas)</label>
                    <input type="text" id="partials" placeholder="e.g. 19850, 19865">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs text-gray-500 block mb-1">Profit/Loss ($)</label>
                        <input type="number" id="pnl" required placeholder="e.g. -150 or 400">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 block mb-1">Average RR</label>
                        <input type="number" step="0.1" id="rr" required placeholder="e.g. 2.5">
                    </div>
                </div>

                <div>
                    <label class="text-xs text-gray-500 block mb-1">Market/AI Analysis & Thought Process</label>
                    <textarea id="notes" rows="3" placeholder="What confirmed the entry?"></textarea>
                </div>

                <button type="submit" class="w-full bg-ict text-dark font-bold py-3 rounded-lg hover:bg-yellow-500 transition">
                    Log Trade
                </button>
            </form>
        </div>

        <!-- DASHBOARD & STATS -->
        <div class="lg:col-span-2 space-y-6">
            
            <div class="grid grid-cols-3 gap-4">
                <div class="bg-panel p-4 rounded-xl border border-border text-center">
                    <p class="text-xs text-gray-500 tracking-wider">TOTAL TRADES</p>
                    <p id="stat-total" class="text-3xl font-mono font-bold mt-1">0</p>
                </div>
                <div class="bg-panel p-4 rounded-xl border border-border text-center">
                    <p class="text-xs text-gray-500 tracking-wider">WIN RATE</p>
                    <p id="stat-wr" class="text-3xl font-mono font-bold mt-1">0%</p>
                </div>
                <div class="bg-panel p-4 rounded-xl border border-border text-center">
                    <p class="text-xs text-gray-500 tracking-wider">NET PNL</p>
                    <p id="stat-pnl" class="text-3xl font-mono font-bold mt-1">$0</p>
                </div>
            </div>

            <div class="bg-panel p-6 rounded-xl border border-border">
                <h2 class="text-sm text-gray-400 mb-4 font-bold">Win Rate & Performance History</h2>
                <canvas id="wrChart" height="100"></canvas>
            </div>

            <div class="bg-panel rounded-xl border border-border overflow-hidden overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-dark text-gray-500 text-xs uppercase">
                        <tr>
                            <th class="p-4">Date/Time</th>
                            <th class="p-4">Account</th>
                            <th class="p-4">Tags</th>
                            <th class="p-4">PnL</th>
                            <th class="p-4">Action</th>
                        </tr>
                    </thead>
                    <tbody id="tradeTable" class="divide-y divide-border">
                        <!-- Trades injected here -->
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <script>
        let trades = JSON.parse(localStorage.getItem('ict_trades')) || [];
        let chartInstance = null;

        document.getElementById('tradeForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const tags = Array.from(document.querySelectorAll('.ict-tags:checked')).map(cb => cb.value).join(', ');

            const newTrade = {
                id: Date.now(),
                date: document.getElementById('date').value,
                time: document.getElementById('time').value,
                firm: document.getElementById('firm').value,
                accType: document.getElementById('accType').value,
                news: document.getElementById('news').value,
                tags: tags,
                entry: document.getElementById('entry').value,
                exit: document.getElementById('exit').value,
                partials: document.getElementById('partials').value,
                pnl: parseFloat(document.getElementById('pnl').value),
                rr: document.getElementById('rr').value,
                notes: document.getElementById('notes').value
            };

            trades.push(newTrade);
            localStorage.setItem('ict_trades', JSON.stringify(trades));
            this.reset();
            updateDashboard();
        });

        function deleteTrade(id) {
            trades = trades.filter(t => t.id !== id);
            localStorage.setItem('ict_trades', JSON.stringify(trades));
            updateDashboard();
        }

        function updateDashboard() {
            // Table
            const tbody = document.getElementById('tradeTable');
            tbody.innerHTML = '';
            trades.slice().reverse().forEach(t => {
                const color = t.pnl >= 0 ? 'text-green-500' : 'text-red-500';
                tbody.innerHTML += `
                    <tr>
                        <td class="p-4 font-mono">${t.date} ${t.time}</td>
                        <td class="p-4">${t.firm} <span class="text-xs text-gray-500">(${t.accType})</span></td>
                        <td class="p-4 text-xs">${t.tags || '-'}</td>
                        <td class="p-4 font-mono font-bold ${color}">${t.pnl >= 0 ? '+' : ''}$${t.pnl}</td>
                        <td class="p-4">
                            <button onclick="deleteTrade(${t.id})" class="text-red-500 hover:text-red-400">Delete</button>
                        </td>
                    </tr>
                `;
            });

            // Stats
            const total = trades.length;
            const wins = trades.filter(t => t.pnl > 0).length;
            const wr = total === 0 ? 0 : Math.round((wins / total) * 100);
            const netPnl = trades.reduce((sum, t) => sum + t.pnl, 0);

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-wr').innerText = `${wr}%`;
            document.getElementById('stat-pnl').innerText = `${netPnl >= 0 ? '+' : ''}$${netPnl}`;
            document.getElementById('stat-pnl').className = `text-3xl font-mono font-bold mt-1 ${netPnl >= 0 ? 'text-green-500' : 'text-red-500'}`;

            // Chart
            updateChart();
        }

        function updateChart() {
            const ctx = document.getElementById('wrChart').getContext('2d');
            const labels = trades.map((_, i) => `Trade ${i + 1}`);
            
            let cumulative = 0;
            const data = trades.map(t => {
                cumulative += t.pnl;
                return cumulative;
            });

            if(chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Cumulative PnL ($)',
                        data: data,
                        borderColor: '#E0A93E',
                        backgroundColor: 'rgba(224, 169, 62, 0.1)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: { grid: { color: '#1F242C' }, ticks: { color: '#8891A0' } },
                        x: { grid: { display: false }, ticks: { color: '#8891A0' } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        function exportToExcel() {
            if(trades.length === 0) return alert("No trades to export!");
            // Clean up the data for Excel
            const excelData = trades.map(t => ({
                "Date": t.date,
                "Time (ET)": t.time,
                "Firm": t.firm,
                "Account Type": t.accType,
                "News Impact": t.news,
                "ICT Setups": t.tags,
                "Entry Price": t.entry,
                "Final Exit": t.exit,
                "Partials": t.partials,
                "PnL ($)": t.pnl,
                "Avg RR": t.rr,
                "Analysis Notes": t.notes
            }));

            const worksheet = XLSX.utils.json_to_sheet(excelData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "ICT Journal");
            XLSX.writeFile(workbook, "Trading_Journal.xlsx");
        }

        // Init
        updateDashboard();
    </script>
</body>
</html>
